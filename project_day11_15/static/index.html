<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能开发助手</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f5f7; color: #1d1d1f; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 14px 20px; background: #fff; border-bottom: 1px solid #e8e8ed; font-weight: 600; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 76%; padding: 10px 14px; border-radius: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .user { align-self: flex-end; background: #0071e3; color: #fff; }
  .assistant { align-self: flex-start; background: #fff; border: 1px solid #e8e8ed; }
  .tool { align-self: flex-start; background: #eef4ff; color: #3a5b8c; font-size: 12.5px; font-family: ui-monospace, Consolas, monospace; }
  footer { display: flex; gap: 8px; padding: 12px; background: #fff; border-top: 1px solid #e8e8ed; }
  input { flex: 1; padding: 10px 14px; border: 1px solid #d2d2d7; border-radius: 999px; font-size: 14px; outline: none; }
  input:focus { border-color: #0071e3; }
  button { padding: 10px 22px; border: none; border-radius: 999px; background: #0071e3; color: #fff; cursor: pointer; }
  button:disabled { background: #a8a8ad; }
</style>
</head>
<body>
<header>🤖 智能开发助手（Day 13 · SSE 流式）</header>
<div id="chat"></div>
<footer>
  <input id="input" placeholder="输入消息，回车发送（如：帮我计算 3 + 5 * 2）" autofocus>
  <button id="send">发送</button>
</footer>

<script>
// 参考实现（Day 13 给定，不需要修改）：
// 用 fetch + ReadableStream 消费 POST 的 SSE 流——因为 EventSource 只支持 GET。
const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");
const SESSION_ID = "web-" + Math.random().toString(36).slice(2, 8);

function addMsg(cls, text) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = "";
  sendBtn.disabled = true;
  addMsg("user", text);
  const bubble = addMsg("assistant", "");

  try {
    const resp = await fetch("/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: SESSION_ID, message: text }),
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      bubble.textContent = "❌ " + (err.detail || resp.status);
      return;
    }
    // 按 SSE 规则切分：事件之间以空行分隔，每条事件形如 data: {...}
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buffer.indexOf("\n\n")) !== -1) {
        const event = buffer.slice(0, idx).trim();
        buffer = buffer.slice(idx + 2);
        if (!event.startsWith("data:")) continue;
        const payload = event.slice(5).trim();
        if (payload === "[DONE]") continue;
        try {
          const obj = JSON.parse(payload);
          if (obj.type === "tool") addMsg("tool", "🔧 " + obj.name + " → " + obj.output);
          if (obj.type === "answer") bubble.textContent += obj.content;
          chatEl.scrollTop = chatEl.scrollHeight;
        } catch (e) { /* 半包数据跳过 */ }
      }
    }
  } catch (e) {
    bubble.textContent = "❌ 网络错误：" + e.message;
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.addEventListener("click", send);
inputEl.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
</script>
</body>
</html>
